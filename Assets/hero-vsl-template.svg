<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Miniature VSL temporaire</title>
<desc id="desc">Visuel temporaire en attente de la miniature finale de la video Nostos.</desc>
<defs>
<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#111827"/>
<stop offset="55%" stop-color="#1f3c88"/>
<stop offset="100%" stop-color="#d6b98a"/>
</linearGradient>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<circle cx="1270" cy="170" r="180" fill="rgba(249,247,242,0.08)"/>
<circle cx="240" cy="760" r="220" fill="rgba(249,247,242,0.06)"/>
<rect x="90" y="90" width="1420" height="720" rx="40" fill="rgba(12,16,27,0.22)" stroke="rgba(249,247,242,0.18)"/>
<text x="140" y="330" fill="#f9f7f2" font-family="Georgia, 'Times New Roman', serif" font-size="104">NOSTOS</text>
<text x="140" y="430" fill="#f9f7f2" font-family="Arial, sans-serif" font-size="46" letter-spacing="6">MINIATURE VSL TEMPORAIRE</text>
<text x="140" y="500" fill="#d6d3d1" font-family="Arial, sans-serif" font-size="34">Remplace ce fichier par la miniature finale quand elle sera prete.</text>
<g transform="translate(1180 450)">
<circle r="92" fill="#f9f7f2"/>
<polygon points="-18,-34 42,0 -18,34" fill="#111827"/>
</g>
</svg>
